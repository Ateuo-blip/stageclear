spring.application.name=StageClear
spring.profiles.active=dev


# MySql
spring.datasource.url=jdbc:mysql://localhost:3306/stageclear?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
stageclear.jwt.secret=U3RhZ2VDbGVhci1CZWVTdXBwb3J0LUpXVC1TZWNyZXQtMjAyNi0wNy0wOA==
stageclear.jwt.expire-seconds=7200

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Kafka Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Kafka Consumer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer